<!DOCTYPE html>
<html>
<head>
    <title>Connect WhatsApp</title>
    <style>
        body {
            background: #1a2b3c;
            color: white;
            font-family: Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        img {
            margin-top: 20px;
            border: 5px solid white;
            border-radius: 15px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        h2 {
            color: #00ff99;
        }
    </style>
</head>
<body>
    <h1>Scan to Connect WhatsApp</h1>
    <div id="qr">Loading QR Code...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on('qr', (qr) => {
            document.getElementById('qr').innerHTML = `<img src="${qr}" width="300" alt="WhatsApp QR Code">`;
        });

        socket.on('ready', (msg) => {
            document.getElementById('qr').innerHTML = `<h2>${msg}</h2>`;
        });

        socket.on('disconnected', (reason) => {
            document.getElementById('qr').innerHTML = `<h2 style="color: red;">Disconnected: ${reason}</h2>`;
        });
    </script>
</body>
</html>
